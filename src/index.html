<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <img
        src="./images/logo.png"
        alt="Moyo-logo"
        class="logo"
      />

      <nav class="navigation">
        <div class="nav">
          <a
            class="page page-1 is-active"
            href="#apple"
          >
            apple
          </a>
        </div>
        <div class="nav">
          <a
            class="page page-2"
            href="#sumsung"
          >
            sumsung
          </a>
        </div>
        <div class="nav">
          <a
            class="page page-3"
            href="#smartphones"
          >
            smartphones
          </a>
        </div>
        <div class="nav">
          <a
            class="page page-4"
            href="#laptops&computers"
            data-qa="hover"
          >
            laptops & computers
          </a>
        </div>
        <div class="nav">
          <a
            class="page page-5"
            href="#gadgets"
          >
            gadgets
          </a>
        </div>
        <div class="nav">
          <a
            class="page page-6"
            href="#tablets"
          >
            tablets
          </a>
        </div>
        <div class="nav">
          <a
            class="page page-7"
            href="#photo"
          >
            photo
          </a>
        </div>
        <div class="nav">
          <a
            class="page page-8"
            href="#video"
          >
            video
          </a>
        </div>
      </nav>
    </header>
  </body>
</html>
